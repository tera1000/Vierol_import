name: us_oe_oracle_test
beschreibung: "US_OE Bruttopreise - erste Testladung nach Oracle DWHRR"

datei:
  trennzeichen: "|"
  encoding: utf-8
  hat_header: false
  quoting: none

klassifikation:
  schwellenwert: 0.9

spalten:
  - {position: 0, name: hersteller,   typ: string, pflicht: false}
  - {position: 1, name: oeno,         typ: string,  pflicht: false}
  - {position: 2, name: bezeichnung, typ: string, pflicht: false}
  - {position: 3, name: preis,        typ: decimal_en, pflicht: false}
  - {position: 4, name: datum_update, typ: date_iso, pflicht: false}
  - {position: 5, name: ersatzflag, typ: string, max_laenge: 1, muster: "^[A-Z]?$", pflicht: false}
  - {position: 6, name: ersatznummer, typ: string,  pflicht: false}
  - {position: 7, name: laendercode,  typ: string, max_laenge: 1, muster: "^[A-Z]$", pflicht: false}

mapping:
  felder:
    # Direkt aus der Datei — ziel-Namen matchen die Oracle-Spalten
    - {ziel: hersteller,          kategorie: quelle, von: hersteller}
    - {ziel: oeno,                kategorie: quelle, von: oeno}
    - {ziel: bezeichnung,         kategorie: quelle, von: bezeichnung}
    - {ziel: preis,               kategorie: quelle, von: preis}
    - {ziel: datumletztesupdate,  kategorie: quelle, von: datum_update}
    - {ziel: ersatzflag,          kategorie: quelle, von: ersatzflag}
    - {ziel: ersatznummer,        kategorie: quelle, von: ersatznummer}
    - {ziel: laendercode,         kategorie: quelle, von: laendercode}

    # JAHRMONAT aus dem Ordner-Stichtag "2026-04-01" -> "202604"
    - ziel: jahrmonat
      kategorie: system
      system_quelle: pfad_regex
      regex: "/(\\d{4})-(\\d{2})-\\d{2}"
      gruppen: [1, 2]

    # id, created_at, updated_at absichtlich NICHT gemappt —
    # Oracle setzt sie automatisch (Identity + DEFAULT SYSTIMESTAMP)

zielsystem:
  ref: vierol_oracle_prod
  tabelle: DWHRR.US_OE_BRUTTOPREISE_test
  pk_konflikt: skip                       # oder update / reject
  upsert_key: [hersteller, oeno, jahrmonat]   # der Business-Key
  fehler_schwelle: 0.4